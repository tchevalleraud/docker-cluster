# Docker Cluster appliance: boot messages and console on the VM screen (tty1).
GRUB_CMDLINE_LINUX_DEFAULT="console=ttyS0 console=tty1 quiet"
GRUB_TIMEOUT=2
GRUB_TIMEOUT_STYLE=hidden
GRUB_RECORDFAIL_TIMEOUT=5
GRUB_TERMINAL=console
# Ubuntu cloud images first try to boot without initramfs (GRUB_FORCE_PARTUUID).
# On ESXi the disk driver (vmw_pvscsi) is a module, so the initramfs is required.
GRUB_FORCE_PARTUUID=
