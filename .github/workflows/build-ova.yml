name: Build OVA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -W ignore::DeprecationWarning -m unittest discover tests -v

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils xorriso

      - uses: hashicorp/setup-packer@v3
        with:
          version: "1.16.2"

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Packer build
        working-directory: packer
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          packer init .
          packer validate .
          packer build -color=false \
            -var appliance_version=${{ steps.version.outputs.version }} \
            -var output_dir=../output/qemu .

      - name: Package OVA
        run: ova/build-ova.sh output/qemu/system.qcow2 output ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: docker-cluster-${{ steps.version.outputs.version }}
          path: |
            output/docker-cluster-${{ steps.version.outputs.version }}.ova
            output/docker-cluster-${{ steps.version.outputs.version }}.ova.sha256
          retention-days: 14
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: docker-cluster-${{ steps.version.outputs.version }}-noprops
          path: |
            output/docker-cluster-${{ steps.version.outputs.version }}-noprops.ova
            output/docker-cluster-${{ steps.version.outputs.version }}-noprops.ova.sha256
          retention-days: 14
          compression-level: 0

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" output/*.ova output/*.ova.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes
